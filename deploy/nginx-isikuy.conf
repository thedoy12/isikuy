server {
    listen 80;
    listen [::]:80;
    server_name coinin.store;

    return 301 https://coinin.store$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.coinin.store;

    return 301 https://coinin.store$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name 202.10.37.162 isikuy.local _;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.coinin.store;

    ssl_certificate /etc/letsencrypt/live/coinin.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coinin.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://coinin.store$request_uri;
}

